<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Vita-Flow</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#F5F6FA] grid place-items-center p-5"><div class="bg-white border rounded-2xl shadow-xl p-8 w-full max-w-md text-center"><div class="w-14 h-14 rounded-2xl bg-[#2ECC71] text-white grid place-items-center font-black text-2xl mx-auto">V</div><h1 class="text-3xl font-black text-[#273C75] mt-4">Welcome to Vita-Flow</h1><p class="text-slate-500 mt-2">Sign in or create your account.</p><form id="f" class="mt-6 text-left space-y-3"><label class="text-sm font-semibold">Email</label><input id="email" type="email" required class="w-full border rounded-xl p-3" placeholder="you@example.com"><label class="text-sm font-semibold">Password</label><input id="password" type="password" required minlength="8" class="w-full border rounded-xl p-3" placeholder="Minimum 8 characters"><button id="btn" class="w-full mt-2 bg-[#2ECC71] text-white py-3 rounded-xl font-bold">Sign in</button><div id="msg" class="text-sm text-slate-500 mt-3"></div></form><button id="signup" class="w-full mt-3 border py-3 rounded-xl font-semibold text-[#273C75]">Create account</button></div><script type="module">import {login,signup,handleAuthCallback} from 'https://cdn.jsdelivr.net/npm/@netlify/identity/+esm';const next=new URLSearchParams(location.search).get('next')||'/';const email=document.getElementById('email'),password=document.getElementById('password'),msg=document.getElementById('msg');await handleAuthCallback().catch(()=>{});document.getElementById('f').onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in...';try{await login(email.value,password.value);location.href=next}catch(err){msg.textContent=err.message||'Could not sign in.'}};document.getElementById('signup').onclick=async()=>{msg.textContent='Creating account...';try{await signup(email.value,password.value,{full_name:email.value.split('@')[0]});msg.textContent='Account created. Check your email if confirmation is required.'}catch(err){msg.textContent=err.message||'Could not create account.'}};</script></body></html>
