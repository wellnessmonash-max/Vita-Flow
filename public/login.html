<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Vita-Flow</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#F5F6FA] grid place-items-center p-5"><div class="bg-white border rounded-2xl shadow-xl p-8 w-full max-w-md text-center"><div class="w-14 h-14 rounded-2xl bg-[#2ECC71] text-white grid place-items-center font-black text-2xl mx-auto">V</div><h1 class="text-3xl font-black text-[#273C75] mt-4">Welcome to Vita-Flow</h1><p class="text-slate-500 mt-2">Sign in with a secure email code.</p><form id="f" class="mt-6 text-left"><label class="text-sm font-semibold">Email</label><input id="email" type="email" required class="w-full border rounded-xl p-3 mt-1" placeholder="you@example.com"><div id="codeWrap" class="hidden mt-3"><label class="text-sm font-semibold">6-digit code</label><input id="code" inputmode="numeric" class="w-full border rounded-xl p-3 mt-1" placeholder="123456"></div><button id="btn" class="w-full mt-4 bg-[#2ECC71] text-white py-3 rounded-xl font-bold">Send code</button><div id="msg" class="text-sm text-slate-500 mt-3"></div></form><button id="google" class="hidden w-full mt-3 border py-3 rounded-xl font-semibold text-[#273C75]">Continue with Google</button></div><script>(async()=>{const A=window.hatchable.auth;const q=new URLSearchParams(location.search);const next=q.get('next')||'/';let step=1;const email=document.getElementById('email'),code=document.getElementById('code'),wrap=document.getElementById('codeWrap'),btn=document.getElementById('btn'),msg=document.getElementById('msg'),google=document.getElementById('google');try{const providers=await A.providers();if(providers.includes('google')){google.classList.remove('hidden');google.onclick=()=>A.signInWithGoogle({next})}}catch{}document.getElementById('f').onsubmit=async e=>{e.preventDefault();msg.textContent='';try{if(step===1){const r=await A.startLogin({email:email.value});step=2;wrap.classList.remove('hidden');btn.textContent='Verify code';msg.textContent='Code sent. Check your email.';if(r.has_passkey&&A.supportsPasskeys()){try{const d=await A.signInWithPasskey({email:email.value});if(d?.user)location.href=next}catch{}}}else{await A.verifyCode({email:email.value,code:code.value});location.href=next}}catch(err){msg.textContent=err.message||'Something went wrong.'}}})();</script></body></html>
